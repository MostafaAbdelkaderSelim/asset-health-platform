services:
  airflow:
    build: ./airflow
    container_name: airflow
    command: standalone
    ports:
      - "8088:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_ADMIN_PASSWORD: ${PG_ADMIN_PASSWORD}
    volumes:
      - ./:/opt/project
      - airflow_home:/opt/airflow
    depends_on:
      - postgres

volumes:
  airflow_home:
